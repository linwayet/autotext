    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --warm-cream: #FFF8E7;
            --warm-peach: #FFD4A3;
            --warm-coral: #FF9B71;
            --warm-terracotta: #E86A47;
            --warm-burnt: #C44536;
            --warm-deep: #8B3A3A;
            --warm-chocolate: #5D3A1A;
            --warm-gold: #F4A261;
            --warm-apricot: #FFB997;
            --warm-amber: #FFAA5C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--warm-cream) 0%, var(--warm-peach) 50%, var(--warm-coral) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 155, 113, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(244, 162, 97, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: var(--warm-burnt);
            text-shadow: 3px 3px 0 var(--warm-peach), 6px 6px 0 var(--warm-coral);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: var(--warm-deep);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .student-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 
                0 10px 30px rgba(139, 58, 58, 0.15),
                0 0 0 3px var(--card-border);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
            --card-border: var(--warm-peach);
            --card-gradient-start: var(--warm-gold);
            --card-gradient-end: var(--warm-coral);
            --icon-gradient-start: var(--warm-gold);
            --icon-gradient-end: var(--warm-coral);
        }

        .student-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--card-gradient-start), var(--card-gradient-end));
        }
        
        /* 追風1號 - 天空藍調 */
        .student-card:nth-child(1) {
            --card-border: #A8DAFF;
            --card-gradient-start: #5DADE2;
            --card-gradient-end: #3498DB;
            --icon-gradient-start: #85C1E9;
            --icon-gradient-end: #3498DB;
        }
        
        /* 勁草2號 - 森林綠調 */
        .student-card:nth-child(2) {
            --card-border: #A9DFBF;
            --card-gradient-start: #52BE80;
            --card-gradient-end: #27AE60;
            --icon-gradient-start: #7DCEA0;
            --icon-gradient-end: #27AE60;
        }
        
        /* 破浪3號 - 海洋藍綠 */
        .student-card:nth-child(3) {
            --card-border: #A3E4D7;
            --card-gradient-start: #48C9B0;
            --card-gradient-end: #16A085;
            --icon-gradient-start: #76D7C4;
            --icon-gradient-end: #1ABC9C;
        }
        
        /* 攀峰4號 - 岩石灰褐 */
        .student-card:nth-child(4) {
            --card-border: #D7DBDD;
            --card-gradient-start: #85929E;
            --card-gradient-end: #5D6D7E;
            --icon-gradient-start: #ABB2B9;
            --icon-gradient-end: #5D6D7E;
        }
        
        /* 逐光5號 - 金色陽光 */
        .student-card:nth-child(5) {
            --card-border: #FAD7A0;
            --card-gradient-start: #F5B041;
            --card-gradient-end: #E67E22;
            --icon-gradient-start: #F8C471;
            --icon-gradient-end: #E67E22;
        }
        
        /* 踏浪6號 - 淺藍珊瑚 */
        .student-card:nth-child(6) {
            --card-border: #D6EAF8;
            --card-gradient-start: #5DADE2;
            --card-gradient-end: #2E86C1;
            --icon-gradient-start: #85C1E9;
            --icon-gradient-end: #2980B9;
        }
        
        /* 凌雲7號 - 紫羅蘭 */
        .student-card:nth-child(7) {
            --card-border: #D7BDE2;
            --card-gradient-start: #AF7AC5;
            --card-gradient-end: #8E44AD;
            --icon-gradient-start: #C39BD3;
            --icon-gradient-end: #8E44AD;
        }
        
        /* 馭星8號 - 深藍紫 */
        .student-card:nth-child(8) {
            --card-border: #D4E6F1;
            --card-gradient-start: #5499C7;
            --card-gradient-end: #2874A6;
            --icon-gradient-start: #7FB3D5;
            --icon-gradient-end: #2E86C1;
        }
        
        /* 沐雨9號 - 薄荷綠 */
        .student-card:nth-child(9) {
            --card-border: #D5F4E6;
            --card-gradient-start: #58D68D;
            --card-gradient-end: #28B463;
            --icon-gradient-start: #82E0AA;
            --icon-gradient-end: #28B463;
        }
        
        /* 翔空10號 - 暖橙色 */
        .student-card:nth-child(10) {
            --card-border: #FADBD8;
            --card-gradient-start: #EC7063;
            --card-gradient-end: #CB4335;
            --icon-gradient-start: #F1948A;
            --icon-gradient-end: #E74C3C;
        }
        
        /* 擎天11號 - 琥珀棕 */
        .student-card:nth-child(11) {
            --card-border: #F9E79F;
            --card-gradient-start: #D4AC0D;
            --card-gradient-end: #B7950B;
            --icon-gradient-start: #F4D03F;
            --icon-gradient-end: #D4AC0D;
        }
        
        /* 映月12號 - 銀藍月光 */
        .student-card:nth-child(12) {
            --card-border: #D6DBDF;
            --card-gradient-start: #AEB6BF;
            --card-gradient-end: #85929E;
            --icon-gradient-start: #CCD1D1;
            --icon-gradient-end: #85929E;
        }

        .student-card:nth-child(1) { animation-delay: 0.1s; }
        .student-card:nth-child(2) { animation-delay: 0.15s; }
        .student-card:nth-child(3) { animation-delay: 0.2s; }
        .student-card:nth-child(4) { animation-delay: 0.25s; }
        .student-card:nth-child(5) { animation-delay: 0.3s; }
        .student-card:nth-child(6) { animation-delay: 0.35s; }
        .student-card:nth-child(7) { animation-delay: 0.4s; }
        .student-card:nth-child(8) { animation-delay: 0.45s; }
        .student-card:nth-child(9) { animation-delay: 0.5s; }
        .student-card:nth-child(10) { animation-delay: 0.55s; }
        .student-card:nth-child(11) { animation-delay: 0.6s; }
        .student-card:nth-child(12) { animation-delay: 0.65s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .student-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 
                0 20px 50px rgba(139, 58, 58, 0.25),
                0 0 0 3px var(--card-gradient-end);
        }

        .student-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px dashed var(--card-border);
        }

        .student-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--icon-gradient-start), var(--icon-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }

        .student-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--card-gradient-end);
            font-family: 'Righteous', cursive;
            letter-spacing: 1px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .lesson-button {
            background: linear-gradient(135deg, var(--card-gradient-start), var(--card-gradient-end));
            border: none;
            border-radius: 12px;
            padding: 15px 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }

        .lesson-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .lesson-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .lesson-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            filter: brightness(1.15);
        }

        .lesson-button:active {
            transform: translateY(0) scale(0.98);
        }

        .lesson-number {
            display: block;
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 3px;
        }

        .progress-indicator {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--warm-deep);
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: var(--card-border);
            border-radius: 10px;
            margin: 0 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--card-gradient-start), var(--card-gradient-end));
            border-radius: 10px;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(139, 58, 58, 0.1);
        }

        footer p {
            color: var(--warm-deep);
            font-size: 1rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .students-grid {
                grid-template-columns: 1fr;
            }
            
            .lessons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Floating decoration elements */
        .decoration {
            position: fixed;
            pointer-events: none;
            opacity: 0.1;
            z-index: 0;
        }

        .decoration-1 {
            top: 10%;
            right: 10%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--warm-coral), transparent);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-2 {
            bottom: 15%;
            left: 5%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--warm-gold), transparent);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
    </style>
</head>
